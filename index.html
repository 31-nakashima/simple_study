<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理科基礎問題集</title>
  
  <!-- Supabase JS ライブラリの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
      color: #222;
      line-height: 1.6;
    }
    h1 { font-size: 24px; margin-bottom: 28px; }
    h2 { font-size: 20px; }
    .section-title { margin: 22px 0 10px; font-weight: 700; }
    .block-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .select-block {
      width: 100%;
      min-height: 60px;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .select-block:hover { background: #f5f5f5; }
    .select-block.selected {
      border-color: #1769e0;
      background: #eaf2ff;
      color: #0b4eae;
    }
    .main-button, #nextButton, #retryButton {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .main-button:disabled { background: #aaa; cursor: not-allowed; }
    .choice {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 11px;
      text-align: left;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .choice:hover { background: #f3f3f3; }
    .choice:disabled { cursor: default; color: #222; }
    .correct { background: #d8f5d0 !important; border-color: #399b28; }
    .incorrect { background: #ffdada !important; border-color: #d33; }
    #questionScreen, #resultScreen { display: none; }
    #progress, #meta { color: #666; }
    #meta { font-size: 14px; }
    #feedback { display: none; margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 6px; }
    #nextButton { display: none; }
    #error { color: #c00; white-space: pre-wrap; }
    @media (max-width: 480px) {
      .block-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1 id="appTitle">理科基礎問題集</h1>

  <section id="startScreen">
    <p class="section-title">科目を選択</p>
    <div id="subjectBlocks" class="block-grid">
      <p>読み込み中...</p>
    </div>

    <p class="section-title">難易度を選択</p>
    <div id="difficultyBlocks" class="block-grid">
      <button type="button" class="select-block selected" data-value="all">すべて</button>
      <button type="button" class="select-block" data-value="easy">かんたん</button>
      <button type="button" class="select-block" data-value="normal">ふつう</button>
      <button type="button" class="select-block" data-value="hard">むずかしい</button>
    </div>

    <button id="startButton" class="main-button" type="button" disabled>20問スタート</button>
    <p id="error"></p>
  </section>

  <section id="questionScreen">
    <p id="progress"></p>
    <p id="meta"></p>
    <h2 id="questionText"></h2>
    <div id="choices"></div>
    <div id="feedback">
      <strong id="resultText"></strong>
      <p id="answerText"></p>
      <p id="formulaText"></p>
      <p id="explanationText"></p>
    </div>
    <button id="nextButton" type="button">次の問題</button>
  </section>

  <section id="resultScreen">
    <h2>結果</h2>
    <p id="scoreText"></p>
    <button id="retryButton" type="button">もう一度</button>
  </section>

  <script>
    // 実際のAPI URLに変更してください。
    const API_URL = "https://api.npoint.io/00b1b8a0970149d5a89b";
    
    /*
      Supabase接続設定
    */
    const SUPABASE_URL = "https://wedwysozznvkkvcxppte.supabase.co"; 
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_s59ZDF3DsvcHE36Q8A2Zzw_ToevW6pp"; 

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // --- UUID生成用関数 (session_id, quiz_id用) ---
    function generateUUID() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // ログ記録用変数
    const currentSessionId = generateUUID(); // ページロード時に1度だけ生成
    let currentQuizId = null;

    let quizData = null;
    let selectedSubjectId = "";
    let selectedDifficulty = "all";
    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const $ = (id) => document.getElementById(id);
    const appTitle = $("appTitle");
    const startScreen = $("startScreen");
    const questionScreen = $("questionScreen");
    const resultScreen = $("resultScreen");
    const subjectBlocks = $("subjectBlocks");
    const difficultyBlocks = $("difficultyBlocks");
    const startButton = $("startButton");
    const nextButton = $("nextButton");
    const retryButton = $("retryButton");
    const progress = $("progress");
    const meta = $("meta");
    const questionText = $("questionText");
    const choicesContainer = $("choices");
    const feedback = $("feedback");
    const resultText = $("resultText");
    const answerText = $("answerText");
    const formulaText = $("formulaText");
    const explanationText = $("explanationText");
    const scoreText = $("scoreText");
    const errorText = $("error");

    // --- Supabase ログ記録関数 ---
    async function logToSupabase(eventType, additionalData = {}) {
      if (!currentQuizId) return;

      const subject = quizData?.subjects.find(s => s.subjectId === selectedSubjectId);
      const subjectName = subject ? subject.subject : "";

      const payload = {
        session_id: currentSessionId,
        quiz_id: currentQuizId,
        event_type: eventType,
        subject_id: selectedSubjectId,
        subject_name: subjectName,
        difficulty: selectedDifficulty,
        ...additionalData
      };

      try {
        const { error } = await supabaseClient
          .from('quiz_logs')
          .insert(payload);
          
        if (error) {
          console.error("Supabase Log Error:", error.message);
        }
      } catch (err) {
        console.error("Supabase Log Exception:", err);
      }
    }

    async function loadQuizData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTPステータス: ${response.status}`);
        quizData = await response.json();
        if (!quizData || !Array.isArray(quizData.subjects)) {
          throw new Error("subjects配列がありません。");
        }
        if (quizData.title) {
          appTitle.textContent = quizData.title;
          document.title = quizData.title;
        }
        createSubjectBlocks();
      } catch (error) {
        subjectBlocks.innerHTML = "";
        errorText.textContent = `問題データを取得できませんでした。\n${error.message}\nAPI_URLとCORS設定を確認してください。`;
      }
    }

    function createSubjectBlocks() {
      subjectBlocks.innerHTML = "";
      quizData.subjects.forEach((subject) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "select-block";
        button.dataset.value = subject.subjectId;
        button.textContent = subject.subject;
        button.addEventListener("click", () => {
          subjectBlocks.querySelectorAll(".select-block").forEach(b => b.classList.remove("selected"));
          button.classList.add("selected");
          selectedSubjectId = subject.subjectId;
          startButton.disabled = false;
          errorText.textContent = "";
        });
        subjectBlocks.appendChild(button);
      });
    }

    difficultyBlocks.addEventListener("click", (event) => {
      const button = event.target.closest(".select-block");
      if (!button) return;
      difficultyBlocks.querySelectorAll(".select-block").forEach(b => b.classList.remove("selected"));
      button.classList.add("selected");
      selectedDifficulty = button.dataset.value;
    });

    function startQuiz() {
      const subject = quizData?.subjects.find(s => s.subjectId === selectedSubjectId);
      if (!subject) {
        errorText.textContent = "科目を選択してください。";
        return;
      }
      const filtered = subject.questions.filter(q => selectedDifficulty === "all" || q.difficulty === selectedDifficulty);
      if (!filtered.length) {
        errorText.textContent = "指定した条件に一致する問題がありません。";
        return;
      }
      selectedQuestions = shuffleArray([...filtered]).slice(0, 20);
      currentQuestionIndex = 0;
      score = 0;
      
      // クイズ開始時に新しいquiz_idを生成し、ログを送信
      currentQuizId = generateUUID();
      logToSupabase("quiz_start");

      startScreen.style.display = "none";
      resultScreen.style.display = "none";
      questionScreen.style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      feedback.style.display = "none";
      nextButton.style.display = "none";
      choicesContainer.innerHTML = "";
      const q = selectedQuestions[currentQuestionIndex];
      progress.textContent = `${currentQuestionIndex + 1} / ${selectedQuestions.length}問 正解数: ${score}`;
      meta.textContent = `q.category||""{q.unit ? " / " + q.unit : ""}`;
      questionText.textContent = q.question;
      q.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = `${String.fromCharCode(65 + index)}. ${choice}`;
        button.addEventListener("click", () => checkAnswer(index));
        choicesContainer.appendChild(button);
      });
    }

    function checkAnswer(index) {
      if (answered) return;
      answered = true;
      const q = selectedQuestions[currentQuestionIndex];
      const buttons = choicesContainer.querySelectorAll(".choice");
      buttons.forEach(b => b.disabled = true);
      buttons[q.correctChoiceIndex].classList.add("correct");
      if (index === q.correctChoiceIndex) {
        score++;
        resultText.textContent = "正解";
      } else {
        buttons[index].classList.add("incorrect");
        resultText.textContent = "不正解";
      }
      
      // 回答ログを送信
      logToSupabase("answer", {
        // question_idがない場合は設問文の先頭20文字を代替として保存
        question_id: q.id || q.questionId || q.question.substring(0, 20), 
        question_number: currentQuestionIndex + 1,
        selected_choice_index: index
      });

      answerText.textContent = `正解: ${q.answer}`;
      formulaText.textContent = q.formula ? `公式・ポイント: ${q.formula}` : "";
      explanationText.textContent = q.explanation ? `解説: ${q.explanation}` : "";
      feedback.style.display = "block";
      nextButton.style.display = "block";
      nextButton.textContent = currentQuestionIndex === selectedQuestions.length - 1 ? "結果を見る" : "次の問題";
      progress.textContent = `${currentQuestionIndex + 1} / ${selectedQuestions.length}問 正解数: ${score}`;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex >= selectedQuestions.length) return showResult();
      showQuestion();
    }

    function showResult() {
      // 終了ログを送信
      logToSupabase("quiz_finish");

      questionScreen.style.display = "none";
      resultScreen.style.display = "block";
      const total = selectedQuestions.length;
      scoreText.textContent = `${total}問中 score問正解です。正答率は{Math.round(score / total * 100)}%です。`;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    startButton.addEventListener("click", startQuiz);
    nextButton.addEventListener("click", nextQuestion);
    retryButton.addEventListener("click", () => {
      resultScreen.style.display = "none";
      startScreen.style.display = "block";
    });
    
    loadQuizData();
  </script>
</body>
</html>
